---
name: "CodeQL and Linter Analysis"

"on":
  push:
    branches: ["latest"]
  pull_request:
    branches: ["latest"]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze-codeql:
    name: Analyze with CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  analyze-shell:
    name: Analyze Shell Scripts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          find . -name '*.sh' -print0 | xargs -0 shellcheck

  analyze-dockerfile:
    name: Analyze Dockerfiles
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install hadolint
        run: |
          wget -O /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.10.0/hadolint-Linux-x86_64 && \
            chmod +x /usr/local/bin/hadolint

      - name: Run hadolint
        run: |
          find . -name 'Dockerfile' -print0 | \
          xargs -0 /usr/local/bin/hadolint

  analyze-yaml:
    name: Analyze YAML Files
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          pip install yamllint

      - name: Run yamllint on all YAML files
        run: |
          find . -name '*.yml' -print0 -o -name '*.yaml' -print0 | \
          xargs -0 yamllint
