---
name: udx-automation / dependency upgrade

"on":
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  config:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: read

    outputs:
      config_path: ${{ steps.config.outputs.config_path }}
      dockerfile: ${{ steps.config.outputs.dockerfile }}
      existing_pr_found: ${{ steps.existing-pr.outputs.found }}
      image: ${{ steps.config.outputs.image }}
      prompt_path: ${{ steps.config.outputs.prompt_path }}
      probe_dockerfile: ${{ steps.config.outputs.probe_dockerfile }}
      report_path: ${{ steps.config.outputs.report_path }}
      update_branch: ${{ steps.config.outputs.update_branch }}
      pr_title: ${{ steps.config.outputs.pr_title }}
      pr_team_reviewers: ${{ steps.config.outputs.pr_team_reviewers }}
      pr_auto_merge: ${{ steps.config.outputs.pr_auto_merge }}
      pr_merge_method: ${{ steps.config.outputs.pr_merge_method }}
      commit_message: ${{ steps.config.outputs.commit_message }}
      validation_command: ${{ steps.config.outputs.validation_command }}
      should_run: ${{ steps.decision.outputs.should_run }}
      skip_reason: ${{ steps.decision.outputs.skip_reason }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Load dependency updater config
        id: config
        run: |
          set -euo pipefail

          config_path="ci/configs/docker-dependency-probe.yaml"

          kind="$(yq -r '.kind // ""' "${config_path}")"
          version="$(yq -r '.version // ""' "${config_path}")"
          if [ "${kind}" != "DockerDependencyProbe" ] || [ "${version}" != "1" ]; then
            echo "Expected ${config_path} to declare kind=DockerDependencyProbe and version=1" >&2
            exit 1
          fi

          {
            echo "config_path=${config_path}"
            echo "dockerfile=$(yq -r '.dockerfile.path // "Dockerfile"' "${config_path}")"
            echo "image=worker-deps-probe:${GITHUB_RUN_ID}"
            echo "prompt_path=$(yq -r '.copilot.prompt // "ci/prompts/docker-dependency-updater.md"' "${config_path}")"
            echo "probe_dockerfile=$(yq -r '.dockerfile.probe.dockerfile // ".tmp/dependency-probe/Dockerfile"' "${config_path}")"
            echo "report_path=$(yq -r '.analysis.report // "docker-dependency-report.json"' "${config_path}")"
            echo "update_branch=$(yq -r '.workflow.update_branch // "automation/docker-dependency-updates"' "${config_path}")"
            echo "pr_title=$(yq -r '.workflow.pull_request.title // "chore(deps): docker dependency upgrade"' "${config_path}")"
            echo "pr_team_reviewers=$(yq -r '.workflow.pull_request.team_reviewers // [] | join(",")' "${config_path}")"
            echo "pr_auto_merge=$(yq -r '.workflow.pull_request.auto_merge // true' "${config_path}")"
            echo "pr_merge_method=$(yq -r '.workflow.pull_request.merge_method // "squash"' "${config_path}")"
            echo "commit_message=$(yq -r '.workflow.commit_message // "chore(deps): update Docker dependency pins"' "${config_path}")"
            echo "validation_command=$(yq -r '.workflow.validation.command // "docker build --progress=plain -t dependency-update-validation ."' "${config_path}")"
          } >> "${GITHUB_OUTPUT}"

          test -f "${config_path}"
          test -f "$(yq -r '.copilot.prompt // "ci/prompts/docker-dependency-updater.md"' "${config_path}")"
          test -f "$(yq -r '.dockerfile.path // "Dockerfile"' "${config_path}")"
          echo "Config loaded: ${config_path}"

      - name: Stop if an update PR is already open
        id: existing-pr
        uses: actions/github-script@v8
        env:
          UPDATE_BRANCH: ${{ steps.config.outputs.update_branch }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:${process.env.UPDATE_BRANCH}`;

            const prs = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head,
              per_page: 100
            });

            core.setOutput("found", prs.data.length > 0 ? "true" : "false");
            if (prs.data.length > 0) {
              console.log(`Update PR already open: ${prs.data[0].html_url}`);
            } else {
              console.log(`No open update PR found for ${head}`);
            }

      - name: Decide updater execution
        id: decision
        run: |
          set -euo pipefail

          if [ "${EXISTING_PR_FOUND}" = "true" ]; then
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
            echo "skip_reason=Update PR already open for ${UPDATE_BRANCH}" >> "${GITHUB_OUTPUT}"
            echo "Config decision: skip, update PR already open for ${UPDATE_BRANCH}"
            exit 0
          fi

          echo "should_run=true" >> "${GITHUB_OUTPUT}"
          echo "skip_reason=" >> "${GITHUB_OUTPUT}"
          echo "Config decision: run analyze/apply, no open updater PR found."
        env:
          EXISTING_PR_FOUND: ${{ steps.existing-pr.outputs.found }}
          UPDATE_BRANCH: ${{ steps.config.outputs.update_branch }}

      - name: Write config summary
        if: always()
        run: |
          {
            echo "## udx-automation / dependency upgrade"
            echo
            echo "| Job | Result | Details |"
            echo "| --- | --- | --- |"
            echo "| config | ${{ job.status }} | Dockerfile: \`${{ steps.config.outputs.dockerfile }}\`; branch: \`${{ steps.config.outputs.update_branch }}\`; reviewers: \`${{ steps.config.outputs.pr_team_reviewers }}\`; auto-merge: \`${{ steps.config.outputs.pr_auto_merge }}\`; should run: \`${{ steps.decision.outputs.should_run }}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  analyze:
    needs: config
    if: needs.config.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    outputs:
      apt_count: ${{ steps.report.outputs.apt_count }}
      observed_count: ${{ steps.report.outputs.observed_count }}
      probe_count: ${{ steps.report.outputs.probe_count }}
      report_path: ${{ needs.config.outputs.report_path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Render unpinned probe Dockerfile
        run: |
          mkdir -p "$(dirname "${PROBE_DOCKERFILE}")"
          yq -o=json '.' "${PROBE_CONFIG}" > .tmp/dependency-probe/config.json

          ruby -rjson -e '
            config = JSON.parse(File.read(ENV.fetch("PROBE_CONFIG_JSON")))
            dockerfile = ENV.fetch("DOCKERFILE")
            output = ENV.fetch("PROBE_DOCKERFILE")

            flatten_specs = lambda do |value|
              case value
              when Array
                value
              when Hash
                value.flat_map do |group, specs|
                  Array(specs).map { |spec| spec.merge("group" => spec["group"] || group) }
                end
              else
                []
              end
            end

            dependencies = config["dependencies"] || {}
            probes = flatten_specs.call(dependencies["probes"])
            managed_args = probes
              .select { |probe| (probe["update_strategy"] || "unpin_probe") == "unpin_probe" }
              .map { |probe| probe["maps_to_arg"] }
              .compact
              .uniq

            in_apt = false

            File.open(output, "w") do |out|
              File.foreach(dockerfile) do |original_line|
                arg_match = original_line.match(/^ARG\s+([A-Za-z_][A-Za-z0-9_]*)=/)
                next if arg_match && managed_args.include?(arg_match[1])

                line = original_line.dup

                if line.include?("apt-get install -y --no-install-recommends")
                  in_apt = true
                elsif in_apt
                  line = line.sub(/^(\s+[A-Za-z0-9.+-]+)=\S+(.+)$/, "\\1\\2")
                end

                managed_args.each do |arg|
                  line = line.gsub("==${#{arg}}", "")
                end

                out.write line

                in_apt = false if in_apt && line.match?(/&&\s*\\?$/)
              end
            end
          '
          echo "Analyze render: ${DOCKERFILE} -> ${PROBE_DOCKERFILE}"
        env:
          DOCKERFILE: ${{ needs.config.outputs.dockerfile }}
          PROBE_CONFIG: ${{ needs.config.outputs.config_path }}
          PROBE_CONFIG_JSON: .tmp/dependency-probe/config.json
          PROBE_DOCKERFILE: ${{ needs.config.outputs.probe_dockerfile }}

      - name: Build unpinned dependency probe
        run: |
          docker build --pull --no-cache -f "${PROBE_DOCKERFILE}" -t "${PROBE_IMAGE}" .
          echo "Analyze build: built ${PROBE_IMAGE} from ${PROBE_DOCKERFILE}"
        env:
          PROBE_DOCKERFILE: ${{ needs.config.outputs.probe_dockerfile }}
          PROBE_IMAGE: ${{ needs.config.outputs.image }}

      - name: Discover pinned apt packages
        run: |
          mkdir -p .tmp/dependency-probe

          awk '
            /apt-get install -y --no-install-recommends/ { in_block=1; next }
            in_block {
              line=$0
              gsub(/\\/, "", line)
              gsub(/^[[:space:]]+/, "", line)
              if (line ~ /^[[:alnum:].+-]+=/) {
                split(line, parts, "=")
                print parts[1]
              }
              if ($0 ~ /&&[[:space:]]*\\?$/) {
                in_block=0
              }
            }
          ' "${DOCKERFILE}" > .tmp/dependency-probe/apt-packages.txt

          apt_count="$(wc -l < .tmp/dependency-probe/apt-packages.txt | tr -d ' ')"
          echo "Analyze apt discovery: found ${apt_count} pinned apt packages in ${DOCKERFILE}"
        env:
          DOCKERFILE: ${{ needs.config.outputs.dockerfile }}

      - name: Collect apt inventory
        run: |
          set -euo pipefail

          mapfile -t apt_packages < .tmp/dependency-probe/apt-packages.txt

          docker run -i --rm --entrypoint bash "${PROBE_IMAGE}" -s -- "${apt_packages[@]}" > .tmp/dependency-probe/apt.json <<'EOF'
          set -euo pipefail

          dpkg-query -W -f='${binary:Package}\t${Version}\n' "$@" \
            | jq -R -s '
                split("\n")
                | map(select(length > 0))
                | map(split("\t") | {name: .[0], installed: .[1]})
              '
          EOF

          apt_count="$(jq 'length' .tmp/dependency-probe/apt.json)"
          echo "Analyze apt inventory: collected installed versions for ${apt_count} packages"
        env:
          PROBE_IMAGE: ${{ needs.config.outputs.image }}

      - name: Collect runtime metadata
        run: |
          docker run -i --rm --entrypoint bash "${PROBE_IMAGE}" -s > .tmp/dependency-probe/runtime.json <<'EOF'
          set -euo pipefail

          jq -n \
            --arg os "$(. /etc/os-release && printf '%s' "${PRETTY_NAME}")" \
            --arg arch "$(uname -m)" \
            '{os: $os, architecture: $arch}'
          EOF

          os="$(jq -r '.os' .tmp/dependency-probe/runtime.json)"
          arch="$(jq -r '.architecture' .tmp/dependency-probe/runtime.json)"
          echo "Analyze runtime: ${os} on ${arch}"
        env:
          PROBE_IMAGE: ${{ needs.config.outputs.image }}

      - name: Collect configured probe inventory
        run: |
          set -euo pipefail

          yq -o=json '.' "${PROBE_CONFIG}" > .tmp/dependency-probe/config.json

          docker run -i --rm --entrypoint bash \
            -v "${PWD}/.tmp/dependency-probe/config.json:/tmp/probe-config.json:ro" \
            "${PROBE_IMAGE}" -s > .tmp/dependency-probe/probes.json <<'EOF'
          set -euo pipefail

          run_probe_commands() {
            local section="$1"

            jq -c "
                  def probe_specs:
                    if type == \"array\" then
                      .[]
                    elif type == \"object\" then
                      to_entries[] | .key as \$group | .value[] | . + {group: (.group // \$group)}
                    else
                      empty
                    end;

                  (.dependencies.${section} // {}) | probe_specs
                " /tmp/probe-config.json \
              | while IFS= read -r spec; do
                  name="$(jq -r '.name' <<< "${spec}")"
                  command="$(jq -r '.command' <<< "${spec}")"
                  installed="$(bash -o pipefail -c "${command}")"

                  jq -n \
                    --arg name "${name}" \
                    --arg type "$(jq -r '.type // "command"' <<< "${spec}")" \
                    --arg command "${command}" \
                    --arg installed "${installed}" \
                    --arg maps_to_arg "$(jq -r '.maps_to_arg // empty' <<< "${spec}")" \
                    --arg update_strategy "$(jq -r '.update_strategy // empty' <<< "${spec}")" \
                    --arg group "$(jq -r '.group // empty' <<< "${spec}")" \
                    --arg source "$(jq -r '.source // empty' <<< "${spec}")" \
                    --arg reason "$(jq -r '.reason // empty' <<< "${spec}")" \
                    '{
                      name: $name,
                      type: $type,
                      command: $command,
                      installed: $installed
                    }
                    + (if $maps_to_arg == "" then {} else {maps_to_arg: $maps_to_arg} end)
                    + (if $update_strategy == "" then {} else {update_strategy: $update_strategy} end)
                    + (if $group == "" then {} else {group: $group} end)
                    + (if $source == "" then {} else {source: $source} end)
                    + (if $reason == "" then {} else {reason: $reason, pinned_in_dockerfile: false} end)'
                done \
              | jq -s '.'
          }

          probes_json="$(run_probe_commands probes)"
          observed_only_json="$(run_probe_commands observed_only)"

          jq -n \
            --argjson probes "${probes_json}" \
            --argjson observed_only "${observed_only_json}" \
            '{probes: $probes, observed_only: $observed_only}'
          EOF

          probe_count="$(jq '.probes | length' .tmp/dependency-probe/probes.json)"
          observed_count="$(jq '.observed_only | length' .tmp/dependency-probe/probes.json)"
          echo "Analyze probes: collected ${probe_count} managed probes and ${observed_count} observed-only probes"
        env:
          PROBE_CONFIG: ${{ needs.config.outputs.config_path }}
          PROBE_IMAGE: ${{ needs.config.outputs.image }}

      - name: Assemble dependency report
        id: report
        run: |
          set -euo pipefail

          base_image="$(awk '$1 == "FROM" { print $2; exit }' "${DOCKERFILE}")"

          jq -n \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg base_image "${base_image}" \
            --slurpfile runtime .tmp/dependency-probe/runtime.json \
            --slurpfile apt .tmp/dependency-probe/apt.json \
            --slurpfile probes .tmp/dependency-probe/probes.json \
            '{
              generated_at: $generated_at,
              method: "unpinned Dockerfile probe build",
              base_image: $base_image,
              runtime: $runtime[0],
              dependencies: {
                apt: $apt[0],
                probes: $probes[0].probes,
                observed_only: $probes[0].observed_only
              }
            }' > "${PROBE_REPORT}"

          report_tmp="${PROBE_REPORT}.tmp"
          jq \
            --arg config_path "${PROBE_CONFIG}" \
            --rawfile config_yaml "${PROBE_CONFIG}" \
            '.probe_config = {path: $config_path, format: "yaml", content: $config_yaml}' \
            "${PROBE_REPORT}" > "${report_tmp}"
          mv "${report_tmp}" "${PROBE_REPORT}"

          apt_count="$(jq '.dependencies.apt | length' "${PROBE_REPORT}")"
          probe_count="$(jq '.dependencies.probes | length' "${PROBE_REPORT}")"
          observed_count="$(jq '.dependencies.observed_only | length' "${PROBE_REPORT}")"
          printf 'apt_count=%s\n' "${apt_count}" >> "${GITHUB_OUTPUT}"
          printf 'probe_count=%s\n' "${probe_count}" >> "${GITHUB_OUTPUT}"
          printf 'observed_count=%s\n' "${observed_count}" >> "${GITHUB_OUTPUT}"
          echo "Analyze report: wrote ${PROBE_REPORT} with apt=${apt_count}, probes=${probe_count}, observed-only=${observed_count}"
        env:
          DOCKERFILE: ${{ needs.config.outputs.dockerfile }}
          PROBE_CONFIG: ${{ needs.config.outputs.config_path }}
          PROBE_REPORT: ${{ needs.config.outputs.report_path }}

      - name: Upload dependency report
        uses: actions/upload-artifact@v5
        with:
          name: docker-dependency-report
          path: |
            ${{ needs.config.outputs.report_path }}
            ${{ needs.config.outputs.probe_dockerfile }}

      - name: Write analyze summary
        if: always()
        run: |
          apt_count="n/a"
          probe_count="n/a"
          observed_count="n/a"

          if [ -f "${PROBE_REPORT}" ]; then
            apt_count="$(jq '.dependencies.apt | length' "${PROBE_REPORT}")"
            probe_count="$(jq '.dependencies.probes | length' "${PROBE_REPORT}")"
            observed_count="$(jq '.dependencies.observed_only | length' "${PROBE_REPORT}")"
          fi

          {
            echo "## udx-automation / dependency upgrade"
            echo
            echo "| Job | Result | Details |"
            echo "| --- | --- | --- |"
            echo "| analyze | ${{ job.status }} | Report: \`${PROBE_REPORT}\`; apt: \`${apt_count}\`; probes: \`${probe_count}\`; observed-only: \`${observed_count}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          PROBE_REPORT: ${{ needs.config.outputs.report_path }}

  apply:
    needs:
      - config
      - analyze
    if: needs.config.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      pr_url: ${{ steps.create-pr.outputs.pull-request-url }}

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Download dependency report
        uses: actions/download-artifact@v6
        with:
          name: docker-dependency-report

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Copilot CLI
        run: |
          npm install -g @github/copilot
          echo "Apply setup: installed Copilot CLI"

      - name: Update Dockerfile with Copilot CLI
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_ALLOW_ALL: "true"
          COPILOT_AUTO_UPDATE: "false"
          PROMPT_PATH: ${{ needs.config.outputs.prompt_path }}
          REPORT_PATH: ${{ needs.config.outputs.report_path }}
        run: |
          set -euo pipefail

          if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "COPILOT_GITHUB_TOKEN secret is required. Use a fine-grained token with Copilot Requests permission." >&2
            exit 1
          fi

          cp "${PROMPT_PATH}" /tmp/docker-dependency-updater-prompt.md

          {
            echo
            echo "Dependency report:"
            echo
            echo '```json'
            cat "${REPORT_PATH}"
            echo
            echo '```'
          } >> /tmp/docker-dependency-updater-prompt.md

          copilot \
            --prompt "$(cat /tmp/docker-dependency-updater-prompt.md)" \
            --allow-all-tools \
            --allow-all-urls \
            --no-ask-user \
            --no-auto-update \
            --silent \
            --share copilot-docker-dependency-session.md

          echo "Apply Copilot: completed; session saved to copilot-docker-dependency-session.md"

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "${DOCKERFILE}"; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Apply changes: no ${DOCKERFILE} changes"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            git diff -- "${DOCKERFILE}" > docker-dependency-update.diff
            changed_lines="$(wc -l < docker-dependency-update.diff | tr -d ' ')"
            echo "Apply changes: ${DOCKERFILE} changed; diff has ${changed_lines} lines"
          fi
        env:
          DOCKERFILE: ${{ needs.config.outputs.dockerfile }}

      - name: Validate Docker build
        if: steps.changes.outputs.changed == 'true'
        run: |
          bash -lc "${VALIDATION_COMMAND}"
          echo "Apply validation: succeeded: ${VALIDATION_COMMAND}"
        env:
          VALIDATION_COMMAND: ${{ needs.config.outputs.validation_command }}

      - name: Prepare pull request body
        if: steps.changes.outputs.changed == 'true'
        run: |
          {
            echo "## Summary"
            echo
            echo "Updates Dockerfile dependency pins using an unpinned probe build and Copilot CLI."
            echo
            echo "## Evidence"
            echo
            echo "- Probe report artifact: \`${REPORT_PATH}\`"
            echo "- Copilot session artifact: \`copilot-docker-dependency-session.md\`"
            echo "- Validation: \`${VALIDATION_COMMAND}\`"
            echo
            echo "## Diff"
            echo
            echo '```diff'
            sed -n '1,220p' docker-dependency-update.diff
            echo '```'
          } > docker-dependency-pr-body.md
          echo "Apply PR body: prepared docker-dependency-pr-body.md"
        env:
          REPORT_PATH: ${{ needs.config.outputs.report_path }}
          VALIDATION_COMMAND: ${{ needs.config.outputs.validation_command }}

      - name: Upload Copilot session
        uses: actions/upload-artifact@v5
        with:
          name: copilot-docker-dependency-session
          path: |
            copilot-docker-dependency-session.md
            docker-dependency-update.diff
          if-no-files-found: ignore

      - name: Create pull request
        id: create-pr
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: ${{ needs.config.outputs.commit_message }}
          title: ${{ needs.config.outputs.pr_title }}
          body-path: docker-dependency-pr-body.md
          branch: ${{ needs.config.outputs.update_branch }}
          add-paths: ${{ needs.config.outputs.dockerfile }}
          team-reviewers: ${{ needs.config.outputs.pr_team_reviewers }}
          draft: false
          delete-branch: true

      - name: Enable pull request auto-merge
        if: >-
          steps.changes.outputs.changed == 'true' &&
          steps.create-pr.outputs.pull-request-url != '' &&
          needs.config.outputs.pr_auto_merge == 'true'
        run: |
          set -euo pipefail

          case "${MERGE_METHOD}" in
            merge|rebase|squash)
              gh pr merge "${PR_URL}" --auto "--${MERGE_METHOD}"
              ;;
            *)
              echo "Unsupported merge method: ${MERGE_METHOD}" >&2
              exit 1
              ;;
          esac

          echo "Apply auto-merge: enabled ${MERGE_METHOD} auto-merge for ${PR_URL}"
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_METHOD: ${{ needs.config.outputs.pr_merge_method }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}

      - name: Write apply summary
        if: always()
        run: |
          pr_url="${PR_URL:-}"
          if [ -z "${pr_url}" ]; then
            pr_url="n/a"
          fi

          {
            echo "## udx-automation / dependency upgrade"
            echo
            echo "| Job | Result | Details |"
            echo "| --- | --- | --- |"
            echo "| config | ${{ needs.config.result }} | Dockerfile: \`${{ needs.config.outputs.dockerfile }}\`; branch: \`${{ needs.config.outputs.update_branch }}\`; reviewers: \`${{ needs.config.outputs.pr_team_reviewers }}\`; auto-merge: \`${{ needs.config.outputs.pr_auto_merge }}\`; should run: \`${{ needs.config.outputs.should_run }}\` |"
            echo "| analyze | ${{ needs.analyze.result }} | Report: \`${{ needs.analyze.outputs.report_path }}\`; apt: \`${{ needs.analyze.outputs.apt_count }}\`; probes: \`${{ needs.analyze.outputs.probe_count }}\`; observed-only: \`${{ needs.analyze.outputs.observed_count }}\` |"
            echo "| apply | ${{ job.status }} | Dockerfile changed: \`${{ steps.changes.outputs.changed }}\`; PR: ${pr_url} |"
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
