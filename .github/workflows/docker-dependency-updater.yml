---
name: Docker APT Dependency Updater

"on":
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docker-apt-dependencies:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update apt package pins in Dockerfile
        id: update
        shell: bash
        run: |
          set -euo pipefail

          dockerfile="Dockerfile"
          base_image="$(awk '/^FROM / { print $2; exit }' "${dockerfile}")"

          mapfile -t apt_packages < <(
            awk '
              /apt-get install -y --no-install-recommends/ { in_block=1; next }
              in_block && /&&/ { in_block=0 }
              in_block {
                gsub(/\\/, "", $0)
                gsub(/^[[:space:]]+/, "", $0)
                if ($0 ~ /^[[:alnum:].:+-]+=/) {
                  split($0, parts, "=")
                  print parts[1]
                }
              }
            ' "${dockerfile}"
          )

          if [ "${#apt_packages[@]}" -gt 0 ]; then
            apt_versions="$(
              docker run --rm "${base_image}" bash -s -- "${apt_packages[@]}" <<'EOF'
          set -euo pipefail
          apt-get update >/dev/null
          for pkg in "$@"; do
            version="$(apt-cache madison "${pkg}" | awk 'NR==1 {print $3}')"
            if [ -n "${version}" ]; then
              printf '%s=%s\n' "${pkg}" "${version}"
            fi
          done
          EOF
            )"

            while IFS='=' read -r pkg version; do
              [ -z "${pkg}" ] && continue
              PKG="${pkg}" VERSION="${version}" perl -0pi -e 's/\Q$ENV{PKG}=\E[^\s\\]+/$ENV{PKG}=$ENV{VERSION}/g' "${dockerfile}"
            done <<< "${apt_versions}"
          fi

          if git diff --quiet -- "${dockerfile}"; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate Docker build
        if: steps.update.outputs.changed == 'true'
        run: docker build --progress=plain -t udx-worker-dependency-update-check .

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(deps): update Docker apt package pins"
          title: "chore(deps): update Docker apt package pins"
          body: |
            ## Summary

            Automated update of Docker apt package version pins in `Dockerfile`.

            Dependabot remains the primary updater for supported ecosystems (Docker base image and GitHub Actions).
            This workflow handles apt package pins, which Dependabot does not update.
          branch: automation/docker-apt-dependency-updates
          delete-branch: true
