name: Release

on:
  push:
    # branches:
    #   - "latest"

jobs:
  docker-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.0.0
        with:
          versionSpec: "6.0.0"

      - name: Clear GitVersion Cache
        run: rm -rf .git/gitversion_cache

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.0.0
        with:
          useConfigFile: true
          configFilePath: ci/git-version.yml

      - name: Build Multi-Arch Docker Image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false  # Do not push yet
          load: true   # Ensure the built image is loaded into the local Docker environment
          tags: |
            usabilitydynamics/udx-worker:${{ steps.gitversion.outputs.semVer }}
            usabilitydynamics/udx-worker:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "usabilitydynamics"
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Extract Image Digest
        id: extract-digest
        run: |
          # Extract the digest of the built image
          IMAGE_DIGEST=$(docker inspect usabilitydynamics/udx-worker:${{ steps.gitversion.outputs.semVer }} | grep -o 'sha256:[a-f0-9]\{64\}' | head -n 1)
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> $GITHUB_ENV
        shell: bash

      - name: Sign Docker Image with Cosign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          IMAGE_DIGEST: ${{ env.IMAGE_DIGEST }}
        run: |
          # Correctly format the reference with @sha256 for Cosign
          cosign sign -y \
            --key env://COSIGN_PRIVATE_KEY \
            usabilitydynamics/udx-worker@${IMAGE_DIGEST}

      - name: Push Signed Docker Images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            usabilitydynamics/udx-worker:${{ steps.gitversion.outputs.semVer }}
            usabilitydynamics/udx-worker:latest

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | \
            sudo sh -s -- -b /usr/local/bin

      - name: Generate SBOM with Retry Logic
        id: generate-sbom
        run: |
          export TRIVY_DISABLE_VEX_NOTICE=true
          set +e
          max_retries=10
          attempt=1
          success=false
          while [ $attempt -le $max_retries ]; do
            echo "Generating SBOM, attempt $attempt..."
            output=$(trivy image --format spdx-json --output sbom.json usabilitydynamics/udx-worker:${{ steps.gitversion.outputs.semVer }} 2>&1)
            sbom_exit_code=$?
            if [ $sbom_exit_code -eq 0 ]; then
              echo "SBOM generation successful."
              success=true
              break
            else
              echo "Retrying in 120 seconds..."
              sleep 120
              attempt=$((attempt+1))
            fi
          done
          if [ "$success" = false ]; then
            exit 1
          fi

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Sign SBOM with Cosign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          cosign attest -y \
            --key env://COSIGN_PRIVATE_KEY \
            --predicate sbom.json \
            --type https://spdx.dev/spdx-specification-2-2-pdf \
            usabilitydynamics/udx-worker:${{ steps.gitversion.outputs.semVer }}
          cosign attest -y \
            --key env://COSIGN_PRIVATE_KEY \
            --predicate sbom.json \
            --type https://spdx.dev/spdx-specification-2-2-pdf \
            usabilitydynamics/udx-worker:latest

      - name: Log out from Docker Hub
        run: docker logout

