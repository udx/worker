---
# Lightweight hints for Docker dependency update automation. Dockerfile remains
# the source of truth; this file only describes repo-specific automation knobs.
kind: DockerDependencyProbe
version: 1

# Dockerfile input and probe build output.
dockerfile:
  path: Dockerfile

  # The probe Dockerfile is a temporary copy used to build a container that
  # reports the apt versions Docker installs when apt pins are removed.
  probe:
    dockerfile: .tmp/dependency-probe/Dockerfile

# GitHub Actions behavior for generated dependency upgrade PRs.
workflow:
  update_branch: automation/docker-dependency-updates
  commit_message: "chore(deps): update Docker dependency pins"

  pull_request:
    title: "chore(deps): docker dependency upgrade"
    team_reviewers:
      - worker
    auto_merge: true
    merge_method: squash

  validation:
    command: docker build --progress=plain -t dependency-update-validation .

# Analysis output.
analysis:
  report: docker-dependency-report.json

# Dependency groups. Apt is discovered from Dockerfile pins and probed
# deterministically; non-apt dependency discovery is delegated to Copilot from
# the Dockerfile and prompt.
dependencies:
  apt:
    discover: true
    source: ubuntu apt repositories

# Copilot prompt input. Behavior lives in the prompt file so instructions are
# not duplicated across two places.
copilot:
  prompt: ci/prompts/docker-dependency-updater.md
