---
kind: workerService
version: udx.io/worker-v1/service
services:
  - name: "webapp"
    command: "sh /usr/local/scripts/process_example.sh"
    autostart: "true"
    autorestart: "false"
    stderr_logfile: "/var/log/supervisor/webapp.err.log"
    stdout_logfile: "/var/log/supervisor/webapp.out.log"
    environment:
      - "KEY1=value1"
      - "KEY2=value2"
