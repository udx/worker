---
kind: workerConfig
version: udx.io/worker-v1/config
config:
  variables:
    DOCKER_IMAGE_NAME: 'udx-worker'

  actors:
    - type: gcp
      creds: '${GCP_CREDS}'
    - type: azure
      creds: '${AZURE_CREDS}'
    - type: aws
      creds: '${AWS_CREDS}'
    - type: bitwarden
      creds: '${BITWARDEN_CREDS}'
